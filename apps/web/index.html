<!doctype html>
<!-- The default theme, until boot.js sets the picked one (src/themes/themes.ts). -->
<html
  lang="en"
  data-theme="amber"
  data-palette="amber"
  data-style="glass"
  data-title-font="instrument-serif"
  data-body-font="instrument-sans"
  data-sidebar="theme"
  data-mode="light"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Amber's --bg (src/themes/themes.ts); theme.ts sets both for the picked theme and mode. -->
    <meta name="theme-color" content="#F5F3F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="notesd" />
    <meta name="apple-mobile-web-app-title" content="notesd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>notesd</title>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div class="boot-tags"></div>
        <div class="boot-list"></div>
        <div class="boot-pane"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
