# notesd on Fly.io: see docs/guides/self-hosting/fly-io.md.
# One machine only: each machine gets its own volume, so a second would hold a
# second, separate copy of the notes.

kill_signal = "SIGTERM"
# notesd takes up to 8 seconds to stop cleanly; Fly's default is 5.
kill_timeout = "20s"

[build]
  image = "ghcr.io/cassiozen/notesd:latest"

[env]
  # Fly's proxy ends X-Forwarded-For with the app's own address; this header
  # it always sets itself.
  NOTESD_CLIENT_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "notesd_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
