# Builds and publishes a release when a v* tag is pushed (docs/contributing/releasing.md).
# Run by hand, it only builds the macOS app, kept as the run's artifact: a dry run of signing and notarizing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write # the Docker image on ghcr.io

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # In a keychain of the run's own, gone with the runner.
      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE is not set; refusing to build an unsigned Mac app"
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Mac app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          mise run release:macos

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: server/bin/notesd-*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    # A tag only: run by hand, the workflow stops at the Mac app.
    if: github.event_name == 'push'
    # Nothing is published unless the Mac app built, signed and notarized.
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which current sdkmanager no longer has.
          # Gradle downloads the platform and build tools it needs.
          packages: platform-tools
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Gradle's dependencies, plugins and wrapper; without them setup can take 20 min on a slow day.
          # basic: the MIT actions/cache wrapper; the default provider is a paid preview for private repos.
          cache-provider: basic

      - name: Check
        run: mise run check && mise run test:android

      - name: Server binaries
        run: mise run release

      - name: Android APK
        env:
          NOTESD_KEYSTORE_BASE64: ${{ secrets.NOTESD_KEYSTORE_BASE64 }}
          NOTESD_KEYSTORE_PASSWORD: ${{ secrets.NOTESD_KEYSTORE_PASSWORD }}
          NOTESD_KEY_ALIAS: ${{ secrets.NOTESD_KEY_ALIAS }}
        run: |
          if [ -z "$NOTESD_KEYSTORE_BASE64" ]; then
            echo "::error::NOTESD_KEYSTORE_BASE64 is not set; refusing to publish an unsigned APK"
            exit 1
          fi
          export NOTESD_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$NOTESD_KEYSTORE_BASE64" | base64 -d > "$NOTESD_KEYSTORE"
          mise run release:android

      # For Play Console, which only takes bundles. A workflow artifact, not a release asset: it can't be sideloaded.
      - name: Android app bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: apps/android/app/build/release/notesd-*.aab
          if-no-files-found: error

      # The same linux binaries in an image: ghcr.io/<owner>/notesd. latest and X.Y only for non-prerelease tags.
      # Before the GitHub release, which can't be re-created: a failed image push can be re-run.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: server/bin

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd server/bin
          rm -f notesd-dev
          cp ../../scripts/notesd-update . # for Updating from Settings (docs/guides/self-hosting/upgrading.md)
          sha256sum notesd-* > SHA256SUMS
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            notesd-* SHA256SUMS
