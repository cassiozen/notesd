name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job per toolchain rather than `mise run check` on one runner: run all at once, the Go race tests,
  # vitest, Playwright and Gradle starve each other's timing-sensitive tests of CPU.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint:go
      - run: mise run test:go

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # The sync engine the web app depends on is a Kotlin build.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Gradle's dependencies, plugins and wrapper; without them setup can take 20 min on a slow day.
          # basic: the MIT actions/cache wrapper; the default provider is a paid preview for private repos.
          cache-provider: basic
      - run: mise run install
      - run: mise run lint:web
      - run: mise run lint:sync-engine
      - run: mise run typecheck
      - run: mise run test:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The browser, with the system libraries it needs.
      - run: mise run install && cd apps/web && mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise run test:e2e
      # Each failed test's trace: what the page showed and did, step by step.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results
          retention-days: 14

  sync-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: mise run install
      - run: mise run test:sync-engine

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which current sdkmanager no longer has.
          # Gradle downloads the platform and build tools it needs.
          packages: platform-tools
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: mise run test:android

  desktop:
    # The macOS app only: Windows and Linux builds aren't set up yet.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # rustup comes with the runner and installs what src-tauri/rust-toolchain.toml pins.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: mise run lint:desktop
      - run: mise run test:desktop
      - run: mise run build:desktop

  # Which apps a change can affect, for the jobs that only run when it can.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # server/: the UI flows and NotesCore's sync tests run against a real notesd.
          filters: |
            ios:
              - 'apps/ios/**'
              - 'server/**'
              - 'shared/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'

  ios:
    needs: changes
    # Skipped counts as passed for a required check.
    if: needs.changes.outputs.ios == 'true'
    # macOS runners cost 10× the minutes of Linux ones on a private repository.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # A fresh runner's first simulator boot takes minutes (7 of test:ios's 25, once): started now, in the
      # background, it boots during lint, NotesCore's tests and the build. simulator.sh then picks the same one.
      - run: (xcrun simctl bootstatus "$(apps/ios/scripts/simulator.sh)" -b >/dev/null 2>&1 &)
      - uses: jdx/mise-action@v2
      - run: mise run lint:ios
      - run: mise run test:ios:core
      - run: mise run test:ios
      # The log only has the failing line: the result bundle has the screenshots and each step up to it.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            apps/ios/build/test.log
            apps/ios/build/DerivedData/Logs/Test/*.xcresult
          retention-days: 14
