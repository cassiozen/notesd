name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which current sdkmanager no longer has.
          # Gradle downloads the platform and build tools it needs.
          packages: platform-tools
      - uses: jdx/mise-action@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Gradle's dependencies, plugins and wrapper; without them setup can take 20 min on a slow day.
          # basic: the MIT actions/cache wrapper; the default provider is a paid preview for private repos.
          cache-provider: basic
      # The e2e tests' browser, with the system libraries it needs.
      - run: mise run install && cd apps/web && mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise run check
      - run: mise run test:android

  desktop:
    # The macOS app only: Windows and Linux builds aren't set up yet.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      # rustup comes with the runner and installs what src-tauri/rust-toolchain.toml pins.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: mise run lint:desktop
      - run: mise run test:desktop
      - run: mise run build:desktop

  ios:
    # macOS runners cost 10× the minutes of Linux ones on a private repository.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint:ios
      - run: mise run test:ios:core
      - run: mise run test:ios
      # The log only has the failing line: the result bundle has the screenshots and each step up to it.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            apps/ios/build/test.log
            apps/ios/build/DerivedData/Logs/Test/*.xcresult
          retention-days: 14
