[tools]
go = "1.27.1"
node = "24.21.0"
pnpm = "10.18.1"
watchexec = "2.8.0"
golangci-lint = "2.14.0"
java = "temurin-21.0.12+8.0.LTS"

[env]
# Static, cgo-free binaries; test:go turns cgo back on for -race.
CGO_ENABLED = "0"
# Android Studio's default SDK location on macOS; set ANDROID_HOME to override.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Library/Android/sdk') }}"

[tasks.install]
description = "Install web dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Go server (rebuilt on change) + Vite, at http://localhost:5173"
depends = ["dev:server", "dev:web"]

[tasks."dev:server"]
description = "Go server on :8080, rebuilt and restarted on .go/.sql changes"
dir = "server"
run = "watchexec --restart --watch . --exts go,sql --ignore internal/web/dist -- sh ../scripts/dev-server.sh"

[tasks."dev:web"]
description = "Vite dev server, proxying the API to :8080"
dir = "apps/web"
depends = ["install"]
run = "pnpm dev"

[tasks."dev:reset"]
description = "Delete the dev database; the next dev:server run seeds it again"
dir = "server"
run = "rm -rf ${NOTESD_DATA_DIR:-data}"

[tasks.check]
description = "Lint, typecheck and test everything"
depends = ["lint", "typecheck", "test"]

[tasks.lint]
depends = ["lint:go", "lint:web"]

[tasks."lint:go"]
dir = "server"
run = "golangci-lint run ./..."

[tasks."lint:web"]
dir = "apps/web"
depends = ["install"]
run = "pnpm lint"

[tasks.typecheck]
dir = "apps/web"
depends = ["install"]
run = "pnpm typecheck"

[tasks.test]
depends = ["test:go", "test:web"]

[tasks."test:go"]
dir = "server"
env = { CGO_ENABLED = "1" }
run = "go test -race ./..."

[tasks."test:web"]
dir = "apps/web"
depends = ["install"]
run = "pnpm test"

[tasks."test:android"]
description = "Android unit tests (JVM and Robolectric); emulator tests stay manual"
dir = "apps/android"
run = "./gradlew :core:test :app:testDebugUnitTest"

[tasks."lint:android"]
dir = "apps/android"
run = "./gradlew ktlintCheck :app:lintDebug"

[tasks."screenshots:android"]
description = "Render every Android screen to apps/android/app/build/screenshots for design review"
dir = "apps/android"
run = "./gradlew :app:testDebugUnitTest --tests notes.app.ScreenshotTest -Pnotes.screenshots --rerun"

[tasks."build:android"]
description = "Debug APK in apps/android/app/build/outputs/apk/debug"
dir = "apps/android"
run = "./gradlew :app:assembleDebug"

[tasks."release:android"]
description = "Release APK in server/bin, signed when NOTESD_KEYSTORE is set (docs/releasing.md)"
dir = "apps/android"
run = """
set -e
version=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo v0.1.0-dev)
version=${version#v}
# vX.Y.Z → XXYYZZ99; vX.Y.Z-rcN → XXYYZZNN, so release candidates sort before the release.
base=${version%%-*}
IFS=. read -r major minor patch <<EOF
$base
EOF
case "$version" in
  *-rc*) suffix=$(printf '%s' "${version#*-rc}" | sed 's/[^0-9].*//') ;;
  *) suffix=99 ;;
esac
code=$(( ((major * 100 + minor) * 100 + patch) * 100 + ${suffix:-0} ))
./gradlew :app:assembleRelease -Pnotes.versionName="$version" -Pnotes.versionCode="$code"
mkdir -p ../../server/bin
signed=app/build/outputs/apk/release/app-release.apk
[ -f "$signed" ] || signed=app/build/outputs/apk/release/app-release-unsigned.apk
cp "$signed" "../../server/bin/notesd-$version.apk"
echo "server/bin/notesd-$version.apk (versionCode $code)"
"""

[tasks."test:ios:core"]
description = "NotesCore on the Mac: fixtures, store, API client, and sync against a real notesd"
dir = "apps/ios/NotesCore"
run = """
set -e
bin="$(pwd)/.build/notesd"
(cd ../../../server && go build -o "$bin" ./cmd/notesd)
NOTESD_SERVER_BIN="$bin" swift test
"""

[tasks."test:ios"]
description = "iOS app tests on a simulator: the editor, then the UI flows against a real notesd"
dir = "apps/ios"
run = """
set -e
bin="$(pwd)/build/notesd"
(cd ../../server && go build -o "$bin" ./cmd/notesd)
sim=$(scripts/simulator.sh)
scripts/with-server.sh "$bin" scripts/xctest.sh build/test.log -project Notes.xcodeproj -scheme Notes \
  -destination "id=$sim" -derivedDataPath build/DerivedData test
"""

[tasks."lint:ios"]
description = "swift-format (apps/ios/.swift-format), warnings fail"
dir = "apps/ios"
run = "swift format lint --strict --recursive Notes NotesTests NotesUITests NotesCore"

[tasks."build:ios"]
description = "Debug build of the iOS app for a simulator"
dir = "apps/ios"
run = "xcodebuild -project Notes.xcodeproj -scheme Notes -destination \"id=$(scripts/simulator.sh)\" -derivedDataPath build/DerivedData build"

[tasks."build:web"]
description = "Build the web app into server/internal/web/dist"
dir = "apps/web"
depends = ["install"]
run = "pnpm build"

[tasks.build]
description = "server/bin/notesd with the web app embedded"
dir = "server"
depends = ["build:web"]
run = "go build -trimpath -ldflags \"-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o bin/notesd ./cmd/notesd"

[tasks.release]
description = "linux/amd64, linux/arm64 and darwin/arm64 binaries in server/bin"
dir = "server"
depends = ["build:web"]
run = """
ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
for target in linux/amd64 linux/arm64 darwin/arm64; do
  os=${target%/*} arch=${target#*/}
  GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o bin/notesd-$os-$arch ./cmd/notesd
done
"""

[tasks.docker]
description = "Docker image notesd:dev for this machine's architecture, from the release binaries"
depends = ["release"]
run = "docker build -t notesd:dev ."

[tasks.clean]
dir = "server"
run = "rm -rf bin"
